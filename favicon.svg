<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Escudo completo (clip para ECG) -->
    <clipPath id="sc">
      <path d="M9,3 C6,3 3,5 3,8 L3,17 C3,22 6,25 9,27 C12,25 15,22 15,17 L15,8 C15,5 12,3 9,3 Z"/>
    </clipPath>
    <!-- Mitad izquierda del escudo (clip corazón navy) -->
    <clipPath id="sl">
      <path d="M9,3 C6,3 3,5 3,8 L3,17 C3,22 6,25 9,27 Z"/>
    </clipPath>
    <!-- Mitad derecha del escudo (clip corazón verde) -->
    <clipPath id="sr">
      <path d="M9,3 C12,3 15,5 15,8 L15,17 C15,22 12,25 9,27 Z"/>
    </clipPath>
  </defs>

  <!-- ── Escudo — fondo bicolor ── -->
  <path d="M9,3 C6,3 3,5 3,8 L3,17 C3,22 6,25 9,27 Z"
        fill="#1F3A6A"/>
  <path d="M9,3 C12,3 15,5 15,8 L15,17 C15,22 12,25 9,27 Z"
        fill="#4A7855"/>

  <!-- ── Escudo — borde exterior blanco ── -->
  <path d="M9,3 C6,3 3,5 3,8 L3,17 C3,22 6,25 9,27 C12,25 15,22 15,17 L15,8 C15,5 12,3 9,3 Z"
        fill="none" stroke="white" stroke-width="1.15" stroke-linejoin="round"/>
  <!-- ── Escudo — borde interior (efecto doble) ── -->
  <path d="M9,5.5 C7,5.5 5.2,7 5.2,9.5 L5.2,17 C5.2,20.5 7,23 9,25.2 C11,23 12.8,20.5 12.8,17 L12.8,9.5 C12.8,7 11,5.5 9,5.5 Z"
        fill="none" stroke="white" stroke-width="0.6" opacity="0.45"/>

  <!-- ── Corazón relleno — mitad izquierda navy ── -->
  <path d="M9,23 C9,23 3,18 3,13 C3,9.5 5,7 7,7 C8,7 8.7,7.8 9,8.5
           C9.3,7.8 10,7 11,7 C13,7 15,9.5 15,13 C15,18 9,23 9,23 Z"
        fill="#1A294B" clip-path="url(#sl)"/>
  <!-- ── Corazón relleno — mitad derecha verde ── -->
  <path d="M9,23 C9,23 3,18 3,13 C3,9.5 5,7 7,7 C8,7 8.7,7.8 9,8.5
           C9.3,7.8 10,7 11,7 C13,7 15,9.5 15,13 C15,18 9,23 9,23 Z"
        fill="#41714E" clip-path="url(#sr)"/>

  <!-- ── Línea ECG / latido ── -->
  <polyline points="3,14.5 5,14.5 6,12 7,17.5 8.5,10 10,14.5 12,14.5 15,14.5"
            fill="none" stroke="white" stroke-width="1.05"
            stroke-linecap="round" stroke-linejoin="round"
            clip-path="url(#sc)"/>

  <!-- ── Engranaje grande navy (10 dientes) — centro (20, 23.5) r=5 ── -->
  <polygon
    points="20,18.5 20.99,20.46 22.94,19.46 22.59,21.62 24.76,21.96
            23.2,23.5 24.76,25.05 22.59,25.38 22.94,27.55 20.99,26.54
            20,28.5 19.01,26.54 17.06,27.55 17.41,25.38 15.25,25.05
            16.8,23.5 15.25,21.96 17.41,21.62 17.06,19.46 19.01,20.46"
    fill="#1A294B"/>
  <circle cx="20" cy="23.5" r="2.2" fill="white"/>
  <circle cx="20" cy="23.5" r="1.2" fill="#1A294B"/>

  <!-- ── Engranaje pequeño teal (8 dientes) — centro (23, 15.5) r=3.5 ── -->
  <polygon
    points="23,12 23.84,13.47 25.48,13.03 25.03,14.66 26.5,15.5
            25.03,16.34 25.48,17.98 23.84,17.53 23,19 22.16,17.53
            20.53,17.98 20.97,16.34 19.5,15.5 20.97,14.66 20.53,13.03
            22.16,13.47"
    fill="#31545A"/>
  <circle cx="23" cy="15.5" r="1.2" fill="white"/>
  <circle cx="23" cy="15.5" r="0.65" fill="#31545A"/>
</svg>
