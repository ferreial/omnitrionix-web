<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A294B"/>
      <stop offset="100%" stop-color="#1E3D2C"/>
    </linearGradient>
    <clipPath id="sc">
      <path d="M16,4 C12,4 8,6 8,8.8 L8,16.2 C8,21.2 11.5,24.4 16,27 C20.5,24.4 24,21.2 24,16.2 L24,8.8 C24,6 20,4 16,4 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Shield left half — navy -->
  <path d="M16,4 C12,4 8,6 8,8.8 L8,16.2 C8,21.2 11.5,24.4 16,27 Z"
        fill="#1E3560"/>
  <!-- Shield right half — green -->
  <path d="M16,4 C20,4 24,6 24,8.8 L24,16.2 C24,21.2 20.5,24.4 16,27 Z"
        fill="#41714E"/>

  <!-- Shield outer border — white -->
  <path d="M16,4 C12,4 8,6 8,8.8 L8,16.2 C8,21.2 11.5,24.4 16,27 C20.5,24.4 24,21.2 24,16.2 L24,8.8 C24,6 20,4 16,4 Z"
        fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Shield inner border — subtle -->
  <path d="M16,6.5 C13,6.5 10.2,7.9 10.2,10 L10.2,16.2 C10.2,19.8 12.7,22.3 16,24.6 C19.3,22.3 21.8,19.8 21.8,16.2 L21.8,10 C21.8,7.9 19,6.5 16,6.5 Z"
        fill="none" stroke="white" stroke-width="0.7" opacity="0.45"/>

  <!-- ECG / heartbeat line -->
  <polyline points="9,16 11,16 12.2,12.8 13.8,19.2 15,13.5 16.2,16 18,16 21,16 23,16"
            fill="none" stroke="white" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"
            clip-path="url(#sc)"/>
</svg>
